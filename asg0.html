<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="utf-8" />
  <title>Draw a blue rectangle (canvas version)</title>
  </head>
 
  <body onload="main()">

  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: .2em">

    <canvas id="example" width="400" height="400">
    Please use a browser that supports "canvas"
    </canvas>
  

    <div style="display:inline-block;">
      <span style="display: inline-block;">v1:</span>

      <div style="display:inline-block;">
        <span style="display: inline-block;">x</span>
        <input id="x" type="number" style="display:inline-block; max-width:100px;"/>
      </div>

      <div style="display:inline-block;">
        <span style="display: inline-block;">y</span>
        <input id="y" type="number" style="display:inline-block;max-width:100px;"/>
      </div> 
    </div>

    <div style="display:inline-block;">
      <span style="display: inline-block;">v2:</span>

      <div style="display:inline-block;">
        <span style="display: inline-block;">x</span>
        <input id="x2" type="number" style="display:inline-block; max-width:100px;"/>
      </div>

      <div style="display:inline-block;">
        <span style="display: inline-block;">y</span>
        <input id="y2" type="number" style="display:inline-block;max-width:100px;"/>
      </div> 
    </div>


    <div style="display:inline-block;">
     <input onclick="handleDrawEvent();this.style.backgroundColor='blue';this.style.border='2px solid blue';
         setTimeout(()=>{this.style.backgroundColor='white';this.style.border='2px solid white';},80);" 
         type="button" 
         style="display:inline-block;background-color:white;border:2px solid white;
                border-radius:4px;filter:drop-shadow(1px 1px 2px rgba(0,0,0,0.4));" value="Draw"/>
    </div> 


    <div style="display:inline-block;margin-top:10px;">
      <span style="display: inline-block;">Operation: </span>
      <select id="operations">
        <option value="add">Add</option>
        <option value="sub">Subtract</option>
        <option value="mul">Multiply</option>
        <option value="div">Divide</option>
        <option value="mag">Magnitude</option>
        <option value="norm">Normalize</option>
        <option value="angle">Angle between</option>
        <option value="area">Area</option>
       </select> 
      <span style="display: inline-block;">Scalar: </span>
      <input id="scalar" type="number" style="max-width:100px;"/>
    </div>


    <div style="display:inline-block;">
      <input onclick="handleDrawOperationEvent();this.style.backgroundColor='blue';this.style.border='2px solid blue';
          setTimeout(()=>{this.style.backgroundColor='white';this.style.border='2px solid white';},80);" 
          type="button" 
          style="display:inline-block;background-color:white;border:2px solid white;
                 border-radius:4px;filter:drop-shadow(1px 1px 2px rgba(0,0,0,0.4));" value="Draw"/>
     </div> 
  </div>

  
   
  <script src="lib/cuon-matrix.js"></script>
  <script src="asg0.js"></script>
  </body>
  </html>
